<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Designaciones</title>
<meta name="description" content="Partidos y cobros de árbitro RFAF">
<meta name="theme-color" content="#1f4b73">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Estilo retro claro: papel, tinta, bordes gruesos y sombras duras. Los colores cambian con el tema (Ajustes). */
:root{
  --bg:#efe5cf; --surface:#fbf5e6; --surface-2:#e5d9bc; --ink:#14213d; --ink-2:#56607a; --line:#14213d;
  --pitch:#1d3f8f; --pitch-2:#2456c4; --card:#f3b61f; --card-ink:#14213d; --red:#c8402f; --ok:#1f7a55;
  --s1:#f3b61f; --s2:#c8402f; --s3:#fbf5e6; --on-pitch:#fbf5e6;
  --hard:3px 3px 0 var(--line); --hard-s:2px 2px 0 var(--line);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1630; --surface:#16224a; --surface-2:#22305e; --ink:#f3ead6; --ink-2:#aab3cf; --line:#060b1c;
    --pitch:#1a3576; --pitch-2:#6f9bff; --card:#f3b61f; --card-ink:#14213d; --red:#ff7a66; --ok:#5fd19b;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Work Sans",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background-image:radial-gradient(color-mix(in srgb,var(--ink) 7%,transparent) 1px,transparent 1px);background-size:14px 14px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
h1,h2,h3,.num{font-family:Oswald,"Arial Narrow",sans-serif;letter-spacing:.01em}

/* Cabecera con franjas */
header.top{background:var(--pitch);color:var(--on-pitch);padding:calc(14px + env(safe-area-inset-top)) 0 16px;position:relative;border-bottom:3px solid var(--line)}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-15px;height:12px;background:linear-gradient(var(--s1) 0 4px,var(--s2) 4px 8px,var(--s3) 8px 12px)}
header.top .wrap{padding-bottom:0;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;flex:none}
header.top h1{font-family:"Alfa Slab One",Georgia,serif;font-weight:400;font-size:24px;margin:0;line-height:1;letter-spacing:.02em;text-shadow:2px 2px 0 rgba(0,0,0,.35)}
header.top small{opacity:.8;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.iconbtn{margin-left:auto;background:var(--card);border:2px solid var(--line);color:var(--card-ink);border-radius:8px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;box-shadow:var(--hard-s)}
.iconbtn:active{transform:translate(2px,2px);box-shadow:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
main.wrap{padding-top:26px}

/* Marcador */
.score{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 18px}
.tile{background:var(--surface);border-radius:10px;padding:12px 14px;border:2px solid var(--line);box-shadow:var(--hard);min-width:0}
.tile .lbl{font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.tile .num{font-size:30px;font-weight:700;line-height:1.15}
.tile .sub{font-size:12px;color:var(--ink-2)}
.tile.warn{background:var(--card);color:var(--card-ink)}
.tile.warn .lbl,.tile.warn .sub{color:color-mix(in srgb,var(--card-ink) 75%,transparent)}
.tile.blue{background:var(--pitch);color:var(--on-pitch)}
.tile.blue .lbl,.tile.blue .sub{color:color-mix(in srgb,var(--on-pitch) 78%,transparent)}
.tile.full{grid-column:1/-1}
.next{display:flex;gap:12px;align-items:center}
.next .when{background:var(--pitch);color:var(--on-pitch);border:2px solid var(--line);border-radius:8px;padding:6px 10px;text-align:center;min-width:60px}
.next .when b{display:block;font-family:Oswald,"Arial Narrow",sans-serif;font-size:24px;line-height:1}
.next .when span{font-size:11px;text-transform:uppercase;opacity:.85}

/* Segmentos */
.seg{display:flex;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:3px;margin:4px 0 16px;box-shadow:var(--hard-s)}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-weight:600}
.seg button.on{background:var(--pitch);color:var(--on-pitch)}

/* Partido */
.month{font-family:Oswald,"Arial Narrow",sans-serif;font-size:15px;text-transform:uppercase;color:var(--ink);margin:20px 2px 10px;letter-spacing:.12em;display:flex;align-items:center;gap:10px}
.month::after{content:"";flex:1;border-top:2px dashed color-mix(in srgb,var(--ink) 35%,transparent)}
.match{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;box-shadow:var(--hard)}
.match:active{transform:translate(2px,2px);box-shadow:var(--hard-s)}
.date{text-align:center;border-right:2px dashed color-mix(in srgb,var(--ink) 30%,transparent);padding-right:10px}
.date b{display:block;font-family:Oswald,"Arial Narrow",sans-serif;font-size:28px;line-height:1}
.date span{font-size:11px;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.teams{min-width:0}
.teams .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teams .meta{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.amt{text-align:right;display:grid;justify-items:end;gap:4px}
.amt .num{font-size:21px;font-weight:700;white-space:nowrap}
.chips{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap;border:1.5px solid var(--line)}
.chip.p{background:var(--card);color:var(--card-ink)}
.chip.c{background:var(--ok);color:#fff}
.chip.f{background:var(--surface-2);color:var(--ink)}
.chip.h{background:var(--pitch);color:var(--on-pitch)}
.chip.old{background:var(--red);color:#fff}
.rol{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px;border:1.5px solid var(--pitch-2)}
.rol.p{background:var(--pitch-2);color:#fff}
.rol.a{background:transparent;color:var(--pitch-2)}
.rol.c{background:var(--surface-2);color:var(--ink-2);border-color:var(--ink-2)}
.split{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--surface-2);margin:4px 0 6px;border:2px solid var(--line)}
.split i{display:block;height:100%}
.split i.p{background:var(--pitch-2)}
.split i.a{background:var(--card)}
.fn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fn .k{font-size:11px;color:var(--ink-2);display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.fn .k::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--pitch-2);border:1.5px solid var(--line)}
.fn .k.a::before{background:var(--card)}
.fn .k.c::before{background:var(--ink-2)}
.fn .num{font-size:26px;font-weight:700;line-height:1.15}
.empty{text-align:center;color:var(--ink-2);padding:40px 10px}

/* Cajas y desplegables */
.box{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px;box-shadow:var(--hard)}
.box h3{margin:0 0 10px;font-size:20px;text-transform:uppercase;letter-spacing:.03em}
details.box{padding:0}
details.box>summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:10px;font-family:Oswald,"Arial Narrow",sans-serif;font-size:19px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary small{font-family:"Work Sans",system-ui,sans-serif;font-size:12px;text-transform:none;letter-spacing:0;color:var(--ink-2);font-weight:500}
details.box>summary::after{content:"+";margin-left:auto;width:26px;height:26px;border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;font-family:Oswald,"Arial Narrow",sans-serif;font-size:18px;line-height:1;background:var(--card);color:var(--card-ink);flex:none}
details.box[open]>summary::after{content:"–"}
details.box[open]>summary{border-bottom:2px dashed color-mix(in srgb,var(--ink) 30%,transparent)}
details.box>.in{padding:12px 14px 14px}

/* Cobros */
.pend{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--hard-s)}
.pend input{width:22px;height:22px;accent-color:var(--pitch-2)}
.pend.sel{background:color-mix(in srgb,var(--pitch-2) 14%,var(--surface))}
.actionbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));display:flex;justify-content:center;padding:0 16px;z-index:4;pointer-events:none}
.actionbar .btn{pointer-events:auto;width:100%;max-width:608px}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
label.f{display:block;font-size:12px;color:var(--ink-2);margin-bottom:10px;font-weight:600}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:2px solid var(--line);border-radius:8px;background:var(--bg);font-weight:500;color:var(--ink)}
.btn{border:2px solid var(--line);border-radius:8px;padding:11px 14px;font-weight:700;cursor:pointer;background:var(--surface-2);box-shadow:var(--hard-s);text-transform:uppercase;letter-spacing:.04em;font-size:14px}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.pri{background:var(--pitch);color:var(--on-pitch)}
.btn.y{background:var(--card);color:var(--card-ink)}
.btn.danger{background:var(--surface);color:var(--red);border-color:var(--red);box-shadow:2px 2px 0 var(--red)}
.btn.danger.full{width:100%}
.btn.link{background:transparent;border:0;box-shadow:none;color:var(--red);text-transform:none;letter-spacing:0;padding:6px}
.btn:disabled{opacity:.45}
.hint{font-size:13px;color:var(--ink-2);margin:6px 0 0}
.hint.ok{color:var(--ok)}
.hint.bad{color:var(--red)}
.ing{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:2px dashed color-mix(in srgb,var(--ink) 25%,transparent)}
.ing:first-of-type{border-top:0}

/* Resumen */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:70px 1fr 78px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden;display:flex;border:1.5px solid var(--line)}
.bar .track i{display:block;height:100%}
.bar .track i.c{background:var(--pitch-2)}
.bar .track i.p{background:var(--card)}
.kmt td{text-align:right}
.kmt td:first-child{text-align:left}
.kmt tr:first-child td{color:var(--ink-2);font-size:11px;border-top:0;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-bottom:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--pitch-2);border:1.5px solid var(--line)}
.legend span.p::before{background:var(--card)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td{padding:8px 0;border-top:1.5px dashed color-mix(in srgb,var(--ink) 25%,transparent)}
table.t td:last-child{text-align:right;font-weight:700}
.sel-stat{display:block;width:100%;padding:9px 12px;border:2px solid var(--line);border-radius:8px;background:var(--bg);font-weight:600;margin-bottom:12px}

/* Selector de colores */
.temas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tema{display:grid;gap:4px;text-align:left;padding:10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;box-shadow:var(--hard-s)}
.tema.on{outline:3px solid var(--pitch-2);outline-offset:2px}
.tema .sw{display:flex;height:18px;border:1.5px solid var(--line);border-radius:4px;overflow:hidden}
.tema .sw i{flex:1}
.tema small{font-size:11px;color:var(--ink-2);line-height:1.25}

/* Navegación inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:3px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs div{display:flex;max-width:640px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:10px 0 8px;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--ink-2);cursor:pointer;position:relative;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--pitch-2)}
nav.tabs button.on::before{content:"";position:absolute;top:-3px;left:22%;right:22%;height:4px;background:var(--card)}
nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:4px;padding:0 5px;border:1.5px solid var(--line)}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(80px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--card-ink);font-size:30px;font-family:Oswald,"Arial Narrow",sans-serif;box-shadow:var(--hard);cursor:pointer;z-index:4}
.fab:active{transform:translate(2px,2px);box-shadow:var(--hard-s)}

/* Hoja de detalle */
dialog{border:0;padding:0;width:100%;max-width:640px;margin:auto auto 0;border-radius:16px 16px 0 0;background:var(--surface);color:var(--ink);max-height:92vh;border-top:3px solid var(--line)}
dialog::backdrop{background:rgba(10,16,36,.55)}
dialog .in{padding:18px 16px calc(18px + env(safe-area-inset-bottom));overflow:auto;max-height:92vh}
dialog h2{margin:0;font-size:27px;line-height:1.1;text-transform:uppercase}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 10px;font-size:14px;margin:14px 0}
.kv dt{color:var(--ink-2);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.kv dd{margin:0}
.equipo{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.equipo li b{font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;border:2px solid var(--line)}
.toast.show{opacity:1}
a{color:var(--pitch-2);font-weight:600}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="#fbf5e6" stroke="#14213d" stroke-width="3"/><circle cx="32" cy="32" r="22" fill="none" stroke="var(--s2)" stroke-width="2" stroke-dasharray="3 3"/><rect x="20" y="16" width="14" height="20" rx="2" fill="#f3b61f" stroke="#14213d" stroke-width="2.5" transform="rotate(-12 27 26)"/><rect x="31" y="20" width="14" height="20" rx="2" fill="#c8402f" stroke="#14213d" stroke-width="2.5" transform="rotate(10 38 30)"/><path d="M18 46h28" stroke="#14213d" stroke-width="3" stroke-linecap="round"/></svg>
    <div><h1>Mis Designaciones</h1><small id="sub">Árbitro RFAF</small></div>
    <button class="iconbtn" id="syncBtn" title="Buscar designaciones nuevas en Gmail" aria-label="Sincronizar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
    </button>
  </div>
</header>

<main class="wrap" id="main"></main>

<button class="fab" id="fab" aria-label="Añadir partido a mano">+</button>

<nav class="tabs"><div>
  <button data-tab="partidos" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 5h-5L8 10z"/></svg>Partidos</button>
  <button data-tab="cobros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>Cobros<span class="badge" id="badge" hidden></span></button>
  <button data-tab="resumen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resumen</button>
  <button data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
</div></nav>

<dialog id="sheet"><div class="in" id="sheetIn"></div></dialog>
<div class="toast" id="toast"></div>

<script>
/* ============================ Estado ============================ */
const PERFIL_DEF = { nombre: '', origen: 'Jaén', provincia: '23', combustible: 'diesel', consumo: 6.5, otrosKm: 0, tarifaKm: 0.26, kmUrbano: 4.5, avisoDias: 30 };
const PROVINCIAS = { '04': 'Almería', '11': 'Cádiz', '14': 'Córdoba', '18': 'Granada', '21': 'Huelva', '23': 'Jaén', '29': 'Málaga', '41': 'Sevilla',
  '01': 'Álava', '02': 'Albacete', '03': 'Alicante', '05': 'Ávila', '06': 'Badajoz', '07': 'Illes Balears', '08': 'Barcelona', '09': 'Burgos', '10': 'Cáceres',
  '12': 'Castellón', '13': 'Ciudad Real', '15': 'A Coruña', '16': 'Cuenca', '17': 'Girona', '19': 'Guadalajara', '20': 'Gipuzkoa', '22': 'Huesca', '24': 'León',
  '25': 'Lleida', '26': 'La Rioja', '27': 'Lugo', '28': 'Madrid', '30': 'Murcia', '31': 'Navarra', '32': 'Ourense', '33': 'Asturias', '34': 'Palencia',
  '35': 'Las Palmas', '36': 'Pontevedra', '37': 'Salamanca', '38': 'S.C. de Tenerife', '39': 'Cantabria', '40': 'Segovia', '42': 'Soria', '43': 'Tarragona',
  '44': 'Teruel', '45': 'Toledo', '46': 'Valencia', '47': 'Valladolid', '48': 'Bizkaia', '49': 'Zamora', '50': 'Zaragoza', '51': 'Ceuta', '52': 'Melilla' };
/* Combinaciones de color (se eligen en Ajustes). "dark" solo cambia los acentos en modo oscuro. */
const TEMAS = {
  costa: { nombre: 'Costa', desc: 'Marino, turquesa y melocotón',

async function api(action, body) {

/* ============================ Cálculos ============================ */
function derivados() {
  const hoy = hoyISO();
  const P = S.data.partidos.slice().sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
  const jugados = P.filter(p => p.fecha < hoy || (p.fecha === hoy && false));
  const proximos = P.filter(p => p.fecha >= hoy);
  const pendientes = jugados.filter(p => p.estado !== 'cobrado');
  const tempAct = temporada(hoy);
  const cobradoTemp = P.filter(p => p.estado === 'cobrado' && temporada(p.fecha) === tempAct).reduce((s, p) => s + total(p), 0);
  return { hoy, P, jugados, proximos, pendientes, tempAct, cobradoTemp, pendTotal: pendientes.reduce((s, p) => s + total(p), 0) };
}

/** Busca qué partidos pendientes suman exactamente el importe recibido (prefiere los más antiguos). */
function cuadrar(importe, lista) {
  const objetivo = Math.round(n(importe) * 100);
  if (objetivo <= 0) return null;
  const items = lista.map(p => ({ id: p.id, c: Math.round(total(p) * 100) })).filter(x => x.c > 0).slice(0, 80);
  const prev = new Int32Array(objetivo + 1).fill(-1), via = new Int16Array(objetivo + 1).fill(-1);
  prev[0] = 0; via[0] = -2;
  items.forEach((it, i) => {
    for (let s = objetivo; s >= it.c; s--) if (via[s] === -1 && via[s - it.c] !== -1 && via[s - it.c] !== i) { via[s] = i; prev[s] = s - it.c; }
  });
  // reconstruye (con comprobación de que no se repite un mismo partido)
  const rec = s => { const ids = []; const used = new Set(); while (s > 0) { const i = via[s]; if (i < 0 || used.has(i)) return null; used.add(i); ids.push(items[i].id); s = prev[s]; } return ids; };
  let r = via[objetivo] !== -1 ? rec(objetivo) : null;
  if (r) return { exacto: true, ids: r };
  for (let s = objetivo - 1; s > 0; s--) if (via[s] !== -1) { r = rec(s); if (r) return { exacto: false, ids: r, suma: s / 100 }; }
  return null;
}

    <label class="f">Fecha<input id="ingFecha" type="date" value="${D.hoy}"></label></div>
    <label class="f">Nota (opcional)<input id="ingNota" placeholder="Transferencia RFAF"></label>
    <p class="hint" id="sug">Escribe el importe y marco los partidos que lo suman. También puedes marcarlos a mano en la lista.</p>`);
  if (!pend.length) h += `<div class="empty">No tienes partidos pendientes de cobro.</div>`;
  else {
    h += `<div class="month">Pendientes</div>`;
    pend.forEach(p => {
      const ds = dias(p.fecha, D.hoy), on = S.sel.has(p.id);
      h += `<label class="pend ${on ? 'sel' : ''}" data-id="${esc(p.id)}" data-t="${total(p)}"><input type="checkbox" ${on ? 'checked' : ''} onchange="toggleSel('${esc(p.id)}',this.checked)">
        <div style="min-width:0"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(titulo(p.local))} – ${esc(titulo(p.visitante))}</div>
        <div class="hint" style="margin:0">${rolChip(p)}${parseD(p.fecha).getDate()} ${MES[parseD(p.fecha).getMonth()]} · <span class="chip ${ds > aviso() ? 'old' : 'p'}">hace ${ds} d</span></div></div>
        <div class="num" style="font-size:19px;font-weight:700">${eur(total(p))}</div></label>`;
    });
    h += `<div class="actionbar" id="barCobro" ${S.sel.size ? '' : 'hidden'}><button class="btn pri" id="btnCobro" onclick="registrarCobro()">Marcar ${S.sel.size} como cobrados · ${eur(selTotal)}</button></div>`;
  }
  const ings = S.data.ingresos.slice().sort((a, b) => b.fecha.localeCompare(a.fecha));
  if (ings.length) {
    h += `<div class="month">Pagos recibidos</div><div class="box">`;
    ings.forEach(i => {
      const nn = (i.partidos || '').split(',').filter(Boolean).length;
      h += `<div class="ing"><div><b>${eur(i.importe)}</b><div class="hint" style="margin:0">${parseD(i.fecha).getDate()} ${MES[parseD(i.fecha).getMonth()]} ${parseD(i.fecha).getFullYear()} · ${nn} partido${nn === 1 ? '' : 's'}${i.nota ? ' · ' + esc(i.nota) : ''}</div></div>
        <button class="btn link" onclick="borrarIngreso('${esc(i.id)}')">Deshacer</button></div>`;
    });
    h += `</div>`;
  }
  return h;
}

function vResumen(D) {
  const temps = [...new Set(D.P.map(p => temporada(p.fecha)))].sort().reverse();
  const t = S.filtroTemp && temps.includes(S.filtroTemp) ? S.filtroTemp : (temps[0] || D.tempAct);
  const P = D.P.filter(p => temporada(p.fecha) === t && p.fecha < D.hoy);
  const ganado = P.reduce((s, p) => s + total(p), 0);
  const cobr = P.filter(p => p.estado === 'cobrado');
  const K = analisisKm(P);
  const fn = { p: { n: 0, e: 0 }, a: { n: 0, e: 0 } };
  P.forEach(p => { const r = rolDe(p) === 'a' ? 'a' : 'p'; fn[r].n++; fn[r].e += total(p); });
  const fnTot = fn.p.e + fn.a.e || 1;
  const kmCob = P.reduce((s, p) => s + n(p.km), 0);

  let h = `<div class="seg">${temps.map(x => `<button class="${x === t ? 'on' : ''}" onclick="S.filtroTemp='${x}';render()">${x}</button>`).join('') || `<button class="on">${t}</button>`}</div>
  <div class="score">
    <div class="tile blue"><div class="lbl">Generado</div><div class="num">${eur(ganado)}</div><div class="sub">${P.length} partidos</div></div>
    <div class="tile"><div class="lbl">Cobrado</div><div class="num">${eur(cobr.reduce((s, p) => s + total(p), 0))}</div><div class="sub">${cobr.length} partidos</div></div>
    <div class="tile ${K.pct != null && K.pct < 95 ? 'warn' : ''}"><div class="lbl">Km que te pagan</div><div class="num">${K.pct == null ? '—' : K.pct + ' %'}</div><div class="sub">${K.pct == null ? (K.viajes ? 'calculando distancias…' : 'sin viajes con km') : 'de los km reales por carretera'}</div></div>
    <div class="tile"><div class="lbl">Kilometraje cobrado</div><div class="num">${eur(kmCob)}</div><div class="sub">${K.coste != null ? 'te ha costado ' + eur(K.coste) + ' en ' + (perfil().combustible === 'gasolina' ? 'gasolina' : 'gasóleo') : 'en la temporada'}</div></div>
  </div>`;
  if (!P.length) return h + `<div class="empty">Sin partidos jugados en esta temporada.</div>` + cajaCuotas(D);
  h += cajaKm(K);
  const linea = (r, txt) => `<div><div class="k ${r}">${txt}</div><div class="num">${eur(fn[r].e)}</div>
    <div class="hint" style="margin:0">${fn[r].n} partido${fn[r].n === 1 ? '' : 's'}${fn[r].n ? ' · ' + eur(fn[r].e / fn[r].n) + ' de media' : ''}</div></div>`;
  h += desp('funcion', 'Principal y asistente', Math.round(fn.p.e / fnTot * 100) + ' % / ' + Math.round(fn.a.e / fnTot * 100) + ' %', `
    <div class="split"><i class="p" style="width:${fn.p.e / fnTot * 100}%"></i><i class="a" style="width:${fn.a.e / fnTot * 100}%"></i></div>
    <div class="hint" style="margin:0 0 12px">${Math.round(fn.p.e / fnTot * 100)} % como principal · ${Math.round(fn.a.e / fnTot * 100)} % como asistente</div>
    <div class="fn">${linea('p', 'Principal')}${linea('a', 'Asistente')}</div>`);
  h += cajaCuotas(D);
  h += cajaDesglose(P);
  return h;
}

/* ---------- Desglose: por mes, por competición o por semanas ---------- */
function cajaDesglose(P) {
  const modo = S.desglose;
  const barras = (grupos, etiqueta) => {
    const ks = Object.keys(grupos).sort();
    const max = Math.max(1, ...ks.map(k => grupos[k].c + grupos[k].p));
    return `<div class="legend"><span>Cobrado</span><span class="p">Pendiente</span></div><div class="bars">` +
      ks.map(k => { const g = grupos[k]; return `<div class="bar"><span>${etiqueta(k, g)}</span><div class="track"><i class="c" style="width:${g.c / max * 100}%"></i><i class="p" style="width:${g.p / max * 100}%"></i></div><b style="text-align:right">${eur(g.c + g.p)}</b></div>`; }).join('') + `</div>`;
  };
  const suma = (G, k, p) => { const g = G[k] = G[k] || { c: 0, p: 0, n: 0 }; g.n++; g[p.estado === 'cobrado' ? 'c' : 'p'] += total(p); };
  let cont;
  if (modo === 'competicion') {
    const comps = {};
    P.forEach(p => { comps[p.competicion] = comps[p.competicion] || { n: 0, e: 0 }; comps[p.competicion].n++; comps[p.competicion].e += total(p); });
    cont = `<table class="t">` + Object.entries(comps).sort((a, b) => b[1].e - a[1].e).map(([c, v]) => `<tr><td>${esc(c)}<div class="hint" style="margin:0">${v.n} partido${v.n === 1 ? '' : 's'}</div></td><td>${eur(v.e)}</td></tr>`).join('') + `</table>`;
  } else if (modo === 'semana') {
    const G = {};
    P.forEach(p => { const d = parseD(p.fecha); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); suma(G, k, p); });
    cont = barras(G, (k, g) => { const d = parseD(k); return d.getDate() + ' ' + MES[d.getMonth()] + ` <span class="hint" style="font-size:11px">×${g.n}</span>`; });
  } else {
    const G = {};
    P.forEach(p => suma(G, p.fecha.slice(0, 7), p));
    cont = barras(G, k => MES[+k.slice(5) - 1] + ' ' + k.slice(2, 4));
  }
  return desp('desglose', 'Desglose', '', `<select class="sel-stat" onchange="S.desglose=this.value;LS.set('desglose',this.value);render()">
      <option value="mes" ${modo === 'mes' ? 'selected' : ''}>Por mes</option>
      <option value="semana" ${modo === 'semana' ? 'selected' : ''}>Por semanas</option>
      <option value="competicion" ${modo === 'competicion' ? 'selected' : ''}>Por competición</option></select>${cont}`);
}

/* ---------- Kilometraje: pagado frente a real ---------- */
const locN = s => String(s || '').toUpperCase().normalize('NFD').replace(/[^A-Z0-9]/g, '');
const claveSitio = p => locN(p.localidad) + '|' + locN(p.campo);
function precioDia(fecha) {
  const C = S.data.combustible || {}, tipo = perfil().combustible === 'gasolina' ? 'gasolina' : 'diesel';
  if (C[fecha] && C[fecha][tipo]) return C[fecha][tipo];
  // si falta ese día, el más cercano que haya
  const fs = Object.keys(C).filter(f => C[f][tipo]).sort((a, b) => Math.abs(dias(a, fecha)) - Math.abs(dias(b, fecha)));
  return fs.length ? C[fs[0]][tipo] : null;
}
function analisisKm(P) {
  const pf = perfil(), Dist = S.data.distancias || {};
  const tarifa = n(pf.tarifaKm) || 0.26;
  // Un viaje = un día a una localidad (aunque haya varios partidos), solo si te pagan km
  const viajes = {};
  P.forEach(p => {
    const k = p.fecha + '|' + locN(p.localidad);
    const v = viajes[k] = viajes[k] || { fecha: p.fecha, localidad: p.localidad, pagado: 0, dist: null };
    v.pagado += n(p.km);
    const d = Dist[claveSitio(p)];
    if (d && (!v.dist || d.carretera > v.dist.carretera)) v.dist = d;
  });
  // Los partidos en tu propia localidad (km urbano) no cuentan: es una cantidad fija
  const lista = Object.values(viajes).filter(v => v.pagado > n(pf.kmUrbano) + 0.001);
  const con = lista.filter(v => v.dist);
  const R = { viajes: lista.length, conDist: con.length, pct: null, saldo: null, locs: [] };
  if (!con.length) return R;
  let kmReal = 0, kmPag = 0, pagado = 0, coste = 0, litros = 0, precios = [];
  const porLoc = {};
  con.forEach(v => {
    const real = v.dist.carretera * 2, pag = v.pagado / tarifa;
    const precio = precioDia(v.fecha);
    const c = real * ((n(pf.consumo) / 100) * (precio || 0) + n(pf.otrosKm));
    kmReal += real; kmPag += pag; pagado += v.pagado; coste += c;
    if (precio) { precios.push(precio); litros += real * n(pf.consumo) / 100; }
    const L = porLoc[locN(v.localidad)] = porLoc[locN(v.localidad)] || { nombre: pueblo(v.localidad), n: 0, carretera: real, pag: 0, pagado: 0, coste: 0 };
    L.n++; L.pag += pag; L.pagado += v.pagado; L.coste += c;
  });
  Object.values(porLoc).forEach(L => { L.pag = L.pag / L.n; });
  return Object.assign(R, {
    pct: Math.round(kmPag / kmReal * 100), saldo: pagado - coste, kmReal, kmPag, pagado, coste,
    precioMedio: precios.length ? precios.reduce((a, b) => a + b, 0) / precios.length : null,
    sinPrecio: precios.length < con.length,
    locs: Object.values(porLoc).sort((a, b) => b.n - a.n || b.carretera - a.carretera),
  });
}
function cajaKm(K) {
  const pf = perfil();
  if (!K.viajes) return '';
  if (!K.conDist) return desp('km', 'Kilometraje', '', `<p class="hint" style="margin:0">Calculando las distancias reales de tus campos desde ${esc(pf.origen)}. Tarda un rato la primera vez; vuelve a mirar en una hora.</p>`);
  const km = x => Math.round(x).toLocaleString('es-ES') + ' km';
  const max = Math.max(K.kmReal, K.kmPag);
  const barra = (txt, v, cls) => `<div class="bar"><span>${txt}</span><div class="track"><i class="${cls}" style="width:${v / max * 100}%"></i></div><b style="text-align:right">${km(v)}</b></div>`;
  const comb = pf.combustible === 'gasolina' ? 'gasolina' : 'gasóleo';
  let h = `<p class="hint" style="margin:0 0 12px">${K.conDist} viaje${K.conDist === 1 ? '' : 's'} con kilometraje, ida y vuelta desde ${esc(pf.origen)}${K.conDist < K.viajes ? ` (faltan ${K.viajes - K.conDist} por calcular)` : ''}.</p>
    <div class="bars">${barra('Pagados', K.kmPag, 'p')}${barra('Reales', K.kmReal, 'c')}</div>
    <p class="hint" style="margin-top:10px">Te pagan <b>${K.pct} %</b> de los km que haces por carretera${K.kmReal > K.kmPag ? ` (te quedan <b>${km(K.kmReal - K.kmPag)}</b> sin pagar)` : ''}.</p>
    <table class="t" style="margin-top:8px">
      <tr><td>Kilometraje cobrado</td><td>${eur(K.pagado)}</td></tr>
      <tr><td>Te cuesta en ${comb}<div class="hint" style="margin:0">${String(n(pf.consumo)).replace('.', ',')} l/100 km${K.precioMedio ? ' · a ' + K.precioMedio.toFixed(3).replace('.', ',') + ' €/l de media' : ''}</div></td><td>${eur(K.coste)}</td></tr>
      <tr><td><b>Diferencia</b></td><td style="color:${K.saldo < 0 ? 'var(--red)' : 'var(--ok)'}">${(K.saldo > 0 ? '+' : '') + eur(K.saldo)}</td></tr>
    </table>
    ${K.sinPrecio ? '<p class="hint">Aún faltan precios del combustible de algunos días; se usa el más cercano.</p>' : ''}
    <div class="month" style="margin-top:16px">Por localidad · ida y vuelta</div>
    <table class="t kmt"><tr><td></td><td>Pagan</td><td>Reales</td></tr>`;
  K.locs.forEach(L => {
    const pag = L.pag / L.n;
    h += `<tr><td>${esc(L.nombre)}<div class="hint" style="margin:0">${L.n} viaje${L.n === 1 ? '' : 's'}</div></td>
      <td><b>${pag.toFixed(0)} km</b></td><td style="color:${pag < L.carretera - 1 ? 'var(--red)' : 'inherit'}">${L.carretera.toFixed(0)} km</td></tr>`;
  });
  h += `</table>`;
  return desp('km', 'Kilometraje', K.pct + ' % pagado', h);
}

/* ---------- ¿Han subido las cuotas? (arbitraje + manutención, sin km) ---------- */
function cajaCuotas(D) {
  const hoy = D.hoy;
  const P = D.P.filter(p => p.fecha < hoy && p.origen !== 'manual');
  const temps = [...new Set(P.map(p => temporada(p.fecha)))].sort();
  if (temps.length < 2) return '';
  const moda = arr => { const c = {}; arr.forEach(x => c[x] = (c[x] || 0) + 1); return +Object.keys(c).sort((a, b) => c[b] - c[a])[0]; };
  const cat = p => String(p.categoria || p.competicion).replace(/\s*\(.*$/, '').replace(/\s+E\.F\..*$/i, '').trim();
  const ipc = S.data.ipc || {};
  const meses = Object.keys(ipc).sort();
  // IPC entre septiembre de la primera temporada y septiembre de la última (o el último dato)
  const ipcEntre = (t0, t1) => {
    const a = meses.find(m => m >= parseInt(t0, 10) + '-09'), b = meses.filter(m => m <= parseInt(t1, 10) + '-09').pop();
    return a && b && b > a ? { v: ipc[b] / ipc[a] - 1, a, b } : null;
  };
  // Se compara el mismo partido tipo: misma categoría, función y localidad (la manutención depende de la distancia)
  const G = {};
  P.forEach(p => {
    const k = cat(p) + '|' + rolDe(p) + '|' + locN(p.localidad);
    const g = G[k] = G[k] || { cat: titulo(cat(p)), rol: rolDe(p), loc: pueblo(p.localidad), n: 0, t: {} };
    g.n++;
    (g.t[temporada(p.fecha)] = g.t[temporada(p.fecha)] || []).push(+(n(p.importe) + n(p.manutencion)).toFixed(2));
  });
  const filas = Object.values(G).map(g => {
    const ts = temps.filter(t => g.t[t]);
    const v = {}; ts.forEach(t => v[t] = moda(g.t[t]));
    const ini = v[ts[0]], fin = v[ts[ts.length - 1]];
    return Object.assign(g, { ts, v, ini, fin, sub: ini ? fin / ini - 1 : null, ipc: ts.length >= 2 ? ipcEntre(ts[0], ts[ts.length - 1]) : null });
  }).filter(g => g.ts.length >= 2 && g.ini > 0).sort((a, b) => b.n - a.n);
  if (!filas.length) return '';

  const KL = {};
  P.forEach(p => { if (n(p.kmRfaf) > n(perfil().kmUrbano)) { const k = locN(p.localidad); (KL[k] = KL[k] || {})[temporada(p.fecha)] = n(p.kmRfaf); } });
  const kmCmp = Object.values(KL).map(o => { const ts = Object.keys(o).sort(); return ts.length >= 2 ? o[ts[ts.length - 1]] / o[ts[0]] - 1 : null; }).filter(x => x != null);
  const kmVar = kmCmp.length ? kmCmp.reduce((a, b) => a + b, 0) / kmCmp.length : null;
  const ipcG = ipcEntre(temps[0], temps[temps.length - 1]);
  const pct = x => (x >= 0 ? '+' : '') + (x * 100).toFixed(x !== 0 && Math.abs(x) < 0.1 ? 1 : 0).replace('.', ',') + ' %';
  const subs = filas.map(g => g.sub).sort((a, b) => a - b);
  const mediana = subs[Math.floor(subs.length / 2)];
  const mesTxt = m => MES[+m.slice(5) - 1] + ' ' + m.slice(0, 4);

  let h = `<div class="fn" style="grid-template-columns:repeat(3,1fr)">
      <div><div class="k">Cuota</div><div class="num">${pct(mediana)}</div><div class="hint" style="margin:0">arbitraje + manutención</div></div>
      <div><div class="k a">IPC</div><div class="num">${ipcG ? pct(ipcG.v) : '—'}</div><div class="hint" style="margin:0">${ipcG ? mesTxt(ipcG.a) + ' → ' + mesTxt(ipcG.b) : 'sin datos aún'}</div></div>
      <div><div class="k c">Km</div><div class="num">${kmVar == null ? '—' : pct(kmVar)}</div><div class="hint" style="margin:0">mismo pueblo</div></div>
    </div>
    <table class="t" style="margin-top:12px"><tr><td></td>${temps.map(t => `<td style="text-align:right;color:var(--ink-2);font-weight:600;font-size:11px;padding-left:8px">${t.slice(2)}</td>`).join('')}<td style="color:var(--ink-2);font-weight:600;font-size:11px;padding-left:8px">Subida</td></tr>`;
  filas.forEach(g => {
    const debe = g.ipc ? g.ini * (1 + g.ipc.v) : null;
    const pierde = g.ipc && g.sub < g.ipc.v;
    h += `<tr><td><span class="rol ${g.rol}">${ROL_TXT[g.rol].slice(0, 5)}.</span>${esc(g.cat)} · ${esc(g.loc)}${pierde ? `<div class="hint bad" style="margin:0">por la inflación debería haber subido a ${eur(debe)}</div>` : ''}</td>
      ${temps.map(t => `<td style="text-align:right;font-weight:500;padding-left:8px">${g.v[t] != null ? g.v[t].toFixed(2).replace('.', ',') : '·'}</td>`).join('')}
      <td style="padding-left:8px;white-space:nowrap;color:${pierde ? 'var(--red)' : 'var(--ok)'}">${pct(g.sub)}</td></tr>`;
  });
  h += `</table><p class="hint">En rojo lo que ha subido menos que el IPC.</p>`;
  return desp('cuotas', '¿Han subido las cuotas?', '(sin contar kilometraje)', h);
}

  <div class="box"><h3>Conexión con Google</h3>
    <label class="f">URL de la aplicación web (Apps Script)<input id="cfgUrl" value="${esc(c.url)}" placeholder="https://script.google.com/macros/s/…/exec"></label>
    <label class="f">Token<input id="cfgTok" value="${esc(c.token)}" autocomplete="off"></label>
    <div class="row"><button class="btn pri" onclick="guardarCfg()">Guardar y probar</button></div>
    <p class="hint" id="cfgMsg">${c.demo ? 'Ahora mismo estás en modo demostración: conecta tu cuenta para ver tus datos.' : ''}</p></div>
  <div class="box"><h3>Exportar</h3><div class="row"><button class="btn" onclick="exportarCSV()">Descargar CSV de partidos</button></div></div>`;
}

/* ============================ Detalle / edición ============================ */
function abrir(id) {
  const p = S.data.partidos.find(x => x.id === id); if (!p) return;
  const mapa = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent([p.campo, p.direccion, p.localidad].filter(Boolean).join(', '));
  const d = parseD(p.fecha);
  $('#sheetIn').innerHTML = `
    <div class="hint" style="margin:0 0 4px">${rolChip(p)}${DOW[d.getDay()]} ${d.getDate()} ${MESL[d.getMonth()].toLowerCase()} ${d.getFullYear()} · ${esc(p.hora)}</div>
    <h2>${esc(titulo(p.local))}<br><span style="color:var(--ink-2)">vs</span> ${esc(titulo(p.visitante))}</h2>
    <dl class="kv">
      <dt>Competición</dt><dd>${esc(p.competicion)}${p.grupo ? ' · ' + esc(p.grupo) : ''}</dd>
      <dt>Campo</dt><dd>${esc(titulo(p.campo))}${p.direccion ? '<br><span class="hint">' + esc(p.direccion) + '</span>' : ''}<br><a href="${mapa}" target="_blank" rel="noopener">Abrir en Maps ↗</a></dd>
      <dt>Designación</dt><dd>${/^\d+$/.test(p.id) ? 'nº ' + esc(p.id) : 'Añadido a mano'}</dd>
      ${equipoHtml(p)}
    </dl>
    <div class="row"><label class="f">Arbitraje<input id="eImp" inputmode="decimal" value="${esc(p.importe)}"></label>
      <label class="f">Manutención<input id="eMan" inputmode="decimal" value="${esc(p.manutencion)}"></label>
      <label class="f">Km<input id="eKm" inputmode="decimal" value="${esc(p.km)}" oninput="kmEditado()"></label></div>
    <label class="f">Kilometraje<select id="eKmModo" onchange="kmModo('${esc(p.id)}')">
      <option value="" ${!p.kmModo ? 'selected' : ''}>Automático</option>
      <option value="si" ${p.kmModo === 'si' ? 'selected' : ''}>Sí lo cobro</option>
      <option value="no" ${p.kmModo === 'no' ? 'selected' : ''}>No lo cobro</option></select></label>
    <p class="hint" id="kmHint" style="margin:-4px 0 10px">${kmTexto(p, p.kmModo || '')}</p>
    <div class="row"><label class="f">Estado<select id="eEst"><option value="pendiente" ${p.estado !== 'cobrado' ? 'selected' : ''}>Pendiente</option><option value="cobrado" ${p.estado === 'cobrado' ? 'selected' : ''}>Cobrado</option></select></label>
      <label class="f">Fecha de cobro<input id="eFc" type="date" value="${esc(p.fechaCobro)}"></label></div>
    <div class="row" style="margin-top:12px"><button class="btn" onclick="$('#sheet').close()">Cerrar</button><button class="btn pri" onclick="guardarPartido('${esc(p.id)}')">Guardar</button></div>
    <div style="margin-top:12px"><button class="btn danger full" onclick="borrarPartido('${esc(p.id)}')">Eliminar partido</button></div>`;
  $('#sheet').showModal();
}
function equipoHtml(p) {
  const e = String(p.equipo || '');
  if (!e || e === '-') return '';
  const fila = x => { const i = x.indexOf(':'); const rol = x.slice(0, i).trim(), nom = x.slice(i + 1).trim();
    const pz = nom.split(','); const bonito = pz.length > 1 ? titulo(pz[1].trim() + ' ' + pz[0].trim()) : titulo(nom);
    return `<li><b>${esc(titulo(rol))}</b> · ${esc(bonito)}</li>`; };
  return `<dt>Equipo</dt><dd><ul class="equipo">${e.split('|').map(fila).join('')}</ul></dd>`;
}
function kmTexto(p, modo) {
  const rf = p.kmRfaf !== undefined && p.kmRfaf !== '' ? eur(p.kmRfaf) : null;
  if (modo === 'si') return 'Se cobra el kilometraje en este partido' + (rf ? ` (la designación pone ${rf}).` : '.');
  if (modo === 'no') return 'No se cobra el kilometraje en este partido.';
  return 'Si ese día tienes otro partido en la misma localidad, el km se cobra solo en uno' + (rf ? `. La designación pone ${rf}.` : '.');
}
function kmModo(id) {
  const p = S.data.partidos.find(x => x.id === id); const m = $('#eKmModo').value;
  if (m === 'no') $('#eKm').value = '0.00';
  if (m === 'si' && !n($('#eKm').value)) $('#eKm').value = n(p.kmRfaf || p.km).toFixed(2);
  if (m === '') $('#eKm').value = p.km;
  $('#kmHint').textContent = kmTexto(p, m);
}
// Si escribes el km a mano, se entiende que lo decides tú
function kmEditado() {
  const sel = $('#eKmModo'); if (sel.value) return;
  sel.value = n($('#eKm').value) > 0 ? 'si' : 'no';
  $('#kmHint').textContent = 'Has cambiado el km a mano: queda fijado así (' + (sel.value === 'si' ? 'Sí lo cobro' : 'No lo cobro') + ').';
}
async function guardarPartido(id) {
  const imp = $('#eImp').value, man = $('#eMan').value, km = $('#eKm').value;
  let est = $('#eEst').value, fc = $('#eFc').value;
  if (est === 'cobrado' && !fc) fc = hoyISO();
  const campos = { importe: n(imp).toFixed(2), manutencion: n(man).toFixed(2), km: n(km).toFixed(2), total: (n(imp) + n(man) + n(km)).toFixed(2), estado: est, fechaCobro: est === 'cobrado' ? fc : '', kmModo: $('#eKmModo').value };
  if (await accion('update', { id, campos }, 'Guardado')) $('#sheet').close();
}
async function borrarPartido(id) {
  if (!confirm('¿Eliminar este partido? Se borra del calendario y no volverá a importarse del correo.')) return;
  if (await accion('delete', { id }, 'Partido eliminado')) $('#sheet').close();
}
function nuevoPartido() {
  $('#sheetIn').innerHTML = `<h2>Añadir partido</h2><p class="hint">Para designaciones que no te llegaron por correo.</p>
    <div class="row"><label class="f">Fecha<input id="nF" type="date" value="${hoyISO()}"></label><label class="f">Hora<input id="nH" type="time" value="12:00"></label></div>
    <label class="f">Equipo local<input id="nL"></label><label class="f">Equipo visitante<input id="nV"></label>
    <label class="f">Competición<input id="nC"></label>
    <div class="row"><label class="f">Campo<input id="nCa"></label><label class="f">Localidad<input id="nLo"></label></div>
    <div class="row"><label class="f">Función<select id="nFu"><option>ARBITRO</option><option>ASISTENTE 1</option><option>ASISTENTE 2</option><option>CUARTO ARBITRO</option></select></label></div>
    <div class="row"><label class="f">Arbitraje<input id="nI" inputmode="decimal"></label><label class="f">Manut.<input id="nM" inputmode="decimal" value="0"></label><label class="f">Km<input id="nK" inputmode="decimal" value="0"></label></div>
    <div class="row" style="margin-top:12px"><button class="btn" onclick="$('#sheet').close()">Cancelar</button><button class="btn pri" onclick="crearPartido()">Añadir</button></div>`;
  $('#sheet').showModal();
}
async function crearPartido() {
  const v = id => $(id).value.trim();
  if (!v('#nL') || !v('#nV')) return toast('Pon los dos equipos');
  const i = n(v('#nI')), m = n(v('#nM')), k = n(v('#nK'));
  const campos = { fecha: v('#nF'), hora: v('#nH'), local: v('#nL'), visitante: v('#nV'), competicion: v('#nC'), campo: v('#nCa'), localidad: v('#nLo'), funcion: v('#nFu'), importe: i.toFixed(2), manutencion: m.toFixed(2), km: k.toFixed(2), total: (i + m + k).toFixed(2) };
  if (await accion('add', { campos }, 'Partido añadido')) $('#sheet').close();
}

/* ============================ Cobros ============================ */
function selUI() {
  let t = 0;
  document.querySelectorAll('.pend').forEach(el => {
    const on = S.sel.has(el.dataset.id);
    el.classList.toggle('sel', on); el.querySelector('input').checked = on;
    if (on) t += +el.dataset.t;
  });
  const b = $('#btnCobro'), bar = $('#barCobro');
  if (bar) bar.hidden = !S.sel.size;
  if (b) b.textContent = `Marcar ${S.sel.size} como cobrados · ${eur(t)}`;
}
function toggleSel(id, on) { on ? S.sel.add(id) : S.sel.delete(id); selUI(); }
function sugerir() {
  const v = $('#ingImp').value, m = $('#sug');
  if (!n(v)) { m.className = 'hint'; m.textContent = 'Escribe el importe y marco los partidos que lo suman.'; S.sel.clear(); selUI(); return; }
  const r = cuadrar(v, derivados().pendientes);
  S.sel = new Set(r ? r.ids : []);
  selUI();
  if (r && r.exacto) { m.className = 'hint ok'; m.textContent = `✓ Cuadra exacto con ${r.ids.length} partido${r.ids.length === 1 ? '' : 's'}. Revisa la selección y confirma.`; }
  else if (r) { m.className = 'hint bad'; m.textContent = `No cuadra exacto. Lo más cercano: ${eur(r.suma)} (diferencia ${eur(n(v) - r.suma)}). Ajusta a mano.`; }
  else { m.className = 'hint bad'; m.textContent = 'Ninguna combinación de pendientes llega a ese importe.'; }
}
async function registrarCobro() {
  const ids = [...S.sel]; if (!ids.length) return;
  const D = derivados();
  const suma = D.pendientes.filter(p => S.sel.has(p.id)).reduce((s, p) => s + total(p), 0);
  const imp = n($('#ingImp') && $('#ingImp').value) || suma;
  const ok = await accion('cobro', { ids, importe: imp.toFixed(2), fecha: ($('#ingFecha') && $('#ingFecha').value) || hoyISO(), nota: ($('#ingNota') && $('#ingNota').value) || '' }, `${ids.length} partido(s) cobrados`);
  if (ok) { S.sel.clear(); render(); }
}
async function borrarIngreso(id) {
  if (!confirm('¿Deshacer este pago? Sus partidos volverán a pendientes.')) return;
  accion('deleteIngreso', { id }, 'Pago deshecho');
}

/* ============================ Ajustes ============================ */
async function guardarPerfil() {
  const v = id => $(id).value;
  const datos = { origen: v('#pfOrigen'), provincia: v('#pfProv'), combustible: v('#pfComb'),
    consumo: n(v('#pfCons')), tarifaKm: n(v('#pfTarifa')) || 0.26, kmUrbano: n(v('#pfUrb')) };
  const msg = $('#pfMsg'); msg.className = 'hint'; msg.textContent = 'Guardando… (si has cambiado la salida, se recalculan las distancias)';
  try { guardar(await api('guardarPerfil', { perfil: datos })); toast('Perfil guardado'); }
  catch (e) { const m = $('#pfMsg'); if (m) { m.className = 'hint bad'; m.textContent = e.message; } }
}
async function guardarCfg() {
  S.cfg.url = $('#cfgUrl').value.trim(); S.cfg.token = $('#cfgTok').value.trim(); S.cfg.demo = false;
  LS.set('cfg', S.cfg);
  const msg = $('#cfgMsg'); msg.className = 'hint'; msg.textContent = 'Probando…';
  try { const d = await api('list'); guardar(d); toast('Conectado ✓'); S.tab = 'partidos'; render(); }
  catch (e) { msg.className = 'hint bad'; msg.textContent = 'No se pudo conectar: ' + e.message; }
}
function activarDemo(on) {
  S.cfg.demo = on; LS.set('cfg', S.cfg);
  if (!on) { S.data = { partidos: [], ingresos: [] }; LS.set('data', S.data); }
  S.tab = 'partidos'; render(); cargar();
}
function exportarCSV() {
  const cols = ['id', 'fecha', 'hora', 'funcion', 'competicion', 'local', 'visitante', 'campo', 'localidad', 'importe', 'manutencion', 'km', 'total', 'estado', 'fechaCobro', 'notas'];
  const csv = [cols.join(';')].concat(S.data.partidos.map(p => cols.map(c => '"' + String(p[c] ?? '').replace(/"/g, '""') + '"').join(';'))).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'partidos.csv'; a.click();
}
function irA(t) { S.tab = t; render(); window.scrollTo(0, 0); }

/* ============================ Arranque ============================ */
aplicarTema();
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { aplicarTema(); render(); });
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => irA(b.dataset.tab));
$('#syncBtn').onclick = () => cargar('sync');
$('#fab').onclick = nuevoPartido;
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') e.target.close(); });
render();
if (S.cfg.demo || (S.cfg.url && S.cfg.token)) cargar();
document.addEventListener('visibilitychange', () => { if (!document.hidden && (S.cfg.demo || S.cfg.url)) cargar(); });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
